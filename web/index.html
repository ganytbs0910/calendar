<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#007aff"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>IdealCal Web</title></head><body>
<header><button id="prev">‹</button><h1 id="month">IdealCal</h1><button id="next">›</button></header>
<section id="join"><h2>共有カレンダーを開く</h2><input id="code" maxlength="32" placeholder="招待コード"><input id="name" maxlength="24" placeholder="表示名"><button id="open">開く</button><p id="error"></p></section>
<main id="app" hidden><div id="weekdays"></div><div id="grid"></div><button id="add" aria-label="予定を追加">＋</button></main>
<dialog id="event"><form method="dialog"><button class="close">×</button><h2 id="eventHeading">予定</h2><input id="title" placeholder="予定名" required><div class="dates"><input id="start" type="datetime-local" required><input id="end" type="datetime-local" required></div><textarea id="memo" placeholder="メモ"></textarea><div class="actions"><button value="cancel">キャンセル</button><button id="save" value="default">保存</button></div></form><section id="social" hidden><div id="attendance"><button data-s="going">参加</button><button data-s="maybe">未定</button><button data-s="declined">不参加</button></div><div id="comments"></div><div class="commentbox"><input id="comment" placeholder="コメント"><button id="send">送信</button></div><label class="photo">写真を追加<input id="photo" type="file" accept="image/*" multiple></label><div id="photos"></div><details><summary>変更履歴</summary><div id="activity"></div></details></section></dialog>
<script src="app.js"></script></body></html>
